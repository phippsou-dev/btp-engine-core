name: Materialize BTP Engine Core

on:
  push:
    branches:
      - main
    paths:
      - "_bootstrap/btp_engine_core.part_*"
      - ".github/workflows/materialize-btp-engine-core.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild archive and materialize repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Rebuilding archive from chunks..."
          cat _bootstrap/btp_engine_core.part_* > /tmp/btp-engine-core.tar.gz.b64
          base64 -d /tmp/btp-engine-core.tar.gz.b64 > /tmp/btp-engine-core.tar.gz

          echo "Extracting archive into repository root..."
          tar -xzf /tmp/btp-engine-core.tar.gz -C .

          echo "Cleaning bootstrap chunks..."
          rm -rf _bootstrap

          echo "Safety scan..."
          if grep -R "ghp_[a-zA-Z0-9_]\{10,\}\|github_pat_[a-zA-Z0-9_]\{10,\}\|sk-[a-zA-Z0-9_]\{10,\}" . --exclude-dir=.git --exclude-dir=tests --exclude="*.py" 2>/dev/null; then
            echo "Possible secret detected. Aborting."
            exit 1
          fi

          if find . \( -name "*.pdf" -o -name "*.zip" \) ! -path "./.git/*" | grep .; then
            echo "Forbidden file detected. Aborting."
            exit 1
          fi

          echo "Committing materialized repo..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "feat: materialize complete BTP Engine Core"
          git push
